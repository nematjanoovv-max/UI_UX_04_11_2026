name: 24/7 High-Availability Keep-Alive Monitor

on:
  schedule:
    # Run every 10 minutes to guarantee zero spin-down across all services
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Smart Delivery Services
        run: |
          echo "=================================================="
          echo "🚀 Smart Delivery 24/7 Keep-Alive Health Monitor"
          echo "Timestamp: $(date -u)"
          echo "=================================================="

          echo "1. Pinging Vercel API & WebApp..."
          VERCEL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://smart-delivery-system-2026.vercel.app/api/health)
          echo "Vercel API HTTP Status: $VERCEL_STATUS"

          echo "2. Pinging Render Backend..."
          RENDER_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://smart-delivery-system-sy6e.onrender.com/api/health)
          echo "Render Backend HTTP Status: $RENDER_STATUS"

          if [ "$VERCEL_STATUS" -eq 200 ] && [ "$RENDER_STATUS" -eq 200 ]; then
            echo "✅ All Smart Delivery services are online, healthy, and awake!"
          else
            echo "⚠️ Warning: Detected status Vercel=$VERCEL_STATUS, Render=$RENDER_STATUS. Retrying in 5s..."
            sleep 5
            curl -s --max-time 45 https://smart-delivery-system-2026.vercel.app/api/health
            curl -s --max-time 45 https://smart-delivery-system-sy6e.onrender.com/api/health
          fi
