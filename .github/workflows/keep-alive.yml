name: 24/7 High-Availability Keep-Alive Monitor

on:
  schedule:
    # Run every 5 minutes to guarantee zero spin-down across all services
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-alive-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Smart Delivery Services
        run: |
          echo "=================================================="
          echo "🚀 Smart Delivery 24/7 Keep-Alive Health Monitor"
          echo "Timestamp: $(date -u)"
          echo "=================================================="

          echo "1. Pinging Vercel API & WebApp..."
          VERCEL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://smart-delivery-system-2026.vercel.app/api/health)
          echo "Vercel API HTTP Status: $VERCEL_STATUS"

          echo "2. Enforcing Telegram Bot Webhook to Vercel Serverless..."
          WEBHOOK_INFO=$(curl -s --max-time 15 https://api.telegram.org/bot9160505584:AAGp4e-rU-4nL-Hw9iJ1BLLY_L6IrxVX4hw/getWebhookInfo)
          CURRENT_URL=$(echo "$WEBHOOK_INFO" | grep -o '"url":"[^"]*' | cut -d'"' -f4)
          EXPECTED_URL="https://smart-delivery-system-2026.vercel.app/api/telegram-webhook"

          if [ "$CURRENT_URL" != "$EXPECTED_URL" ]; then
            echo "⚠️ Webhook URL was: '$CURRENT_URL'. Re-setting to '$EXPECTED_URL'..."
            curl -s -X POST https://api.telegram.org/bot9160505584:AAGp4e-rU-4nL-Hw9iJ1BLLY_L6IrxVX4hw/setWebhook \
              -H "Content-Type: application/json" \
              -d '{"url":"https://smart-delivery-system-2026.vercel.app/api/telegram-webhook","allowed_updates":["message","callback_query"]}'
          else
            echo "✅ Telegram Webhook is correctly set to Vercel: $CURRENT_URL"
          fi

          if [ "$VERCEL_STATUS" -eq 200 ]; then
            echo "✅ Vercel production API & Bot are online, healthy, and awake!"
          else
            echo "⚠️ Warning: Detected status Vercel=$VERCEL_STATUS. Retrying in 5s..."
            sleep 5
            curl -s --max-time 30 https://smart-delivery-system-2026.vercel.app/api/health
          fi
